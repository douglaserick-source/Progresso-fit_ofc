{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sair — ProgressoFit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/base/base.css' %}">
<link rel="stylesheet" href="{% static 'contas/css/tipo_conta.css' %}">
</head>
<body>

<div class="center-wrap">
  <div class="logo" style="justify-content:center; display:flex; margin-bottom:32px;">Progresso<span>Fit</span></div>

  <div class="type-icon" style="font-size:2.6rem;">👋</div>
  <h1>Sair da conta</h1>
  <p class="sub">Tem certeza que deseja sair?</p>

  <form method="post" action="{% url 'account_logout' %}" style="max-width:320px; margin:0 auto;">
    {% csrf_token %}
    {{ redirect_field }}

    <button type="submit" style="width:100%; background:#E85C5C; color:#14171A; border:none; padding:14px; border-radius:3px; font-weight:600; font-family:var(--body); cursor:pointer;">
      Sair
    </button>

    <a href="{% url 'contas:perfil' %}" class="btn-outline" style="display:block; margin-top:12px; text-align:center; padding:12px;">
