{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senha alterada — ProgressoFit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/base/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/account.css' %}">
</head>
<body>

<div class="center-wrap">
  <div class="logo" style="justify-content:center; display:flex; margin-bottom:32px;">
    <a href="{% url 'core:index' %}">Progresso<span>Fit</span></a>
  </div>

  <div class="type-icon" style="font-size:2.6rem;" aria-hidden="true">✅</div>
  <h1>Senha alterada</h1>
  <p class="sub">Sua senha foi alterada com sucesso.</p>

  {% if user.is_authenticated %}
    <a href="{% url 'contas:perfil' %}" class="btn-outline" style="display:inline-block; margin-top:24px; padding:12px 24px; border-radius:20px; border:1px solid var(--line);">Ir para o perfil</a>
  {% else %}
    <a href="{% url 'account_login' %}" class="btn-outline" style="display:inline-block; margin-top:24px; padding:12px 24px; border-radius:20px; border:1px solid var(--line);">Ir para o login</a>
  {% endif %}
</div>

</body>
</html>
